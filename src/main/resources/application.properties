server.port=8080
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/dsp-backend}

spring.application.name=dsp-backend

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# CORS — override with DSP_CORS_ALLOWED_ORIGINS in the environment/Docker
dsp.cors.allowed-origins=${DSP_CORS_ALLOWED_ORIGINS:http://localhost,http://localhost/dsp,http://localhost:5173}

# Installation config — source of truth is dsp-backend/config/ (not packaged in this jar).
# Docker/Compose sets DSP_INSTALLATION_CONFIG_FILE=file:/config/installation-config.json
dsp.installation-config.file=${DSP_INSTALLATION_CONFIG_FILE:file:config/installation/installation-config.json}

# About config — source of truth is dsp-backend/config/about/ (not packaged in this jar).
# Docker/Compose sets DSP_ABOUT_CONFIG_FILE=file:/config/about/about-config.json and
# DSP_ABOUT_CONTENT_DIR=file:/config/about/
dsp.about-config.config-file=${DSP_ABOUT_CONFIG_FILE:file:config/about/about-config.json}
dsp.about-config.content-dir=${DSP_ABOUT_CONTENT_DIR:file:config/about/}

# Map layers and download themes — source of truth is dsp-backend/config/ (not packaged in this jar).
# Docker/Compose sets DSP_MAP_LAYERS_FILE=file:/config/mapLayersConfig.json
dsp.map.layers-file=${DSP_MAP_LAYERS_FILE:file:config/map/mapLayersConfig.json}
dsp.download.themes-file=${DSP_DOWNLOAD_THEMES_FILE:file:config/downloads/downloadThemesConfig.json}
dsp.download.geoserver-wfs-base-url=${DSP_GEOSERVER_WFS_BASE_URL:http://localhost:22669/geoserver/dsp/wfs}

# Pre-generated download files (dsp-job-geo-file-generation publishes them).
# Empty endpoint keeps every download coming from the WFS.
dsp.object-storage.endpoint=${DSP_OBJECT_STORAGE_ENDPOINT:}
dsp.object-storage.region=${DSP_OBJECT_STORAGE_REGION:us-east-1}
dsp.object-storage.bucket=${DSP_OBJECT_STORAGE_BUCKET:}
dsp.object-storage.access-key=${DSP_OBJECT_STORAGE_ACCESS_KEY:}
dsp.object-storage.secret-key=${DSP_OBJECT_STORAGE_SECRET_KEY:}
dsp.object-storage.path-style-access=${DSP_OBJECT_STORAGE_PATH_STYLE_ACCESS:true}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:20654/dsp-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:dsp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:dsp}

# Schema DSP is owned by dsp-core init SQL — do not let Hibernate create/alter tables
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=dsp
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=false

spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.additional-paths=src/main/java