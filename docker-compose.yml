services:
  dsp-backend:
    image: dsp-backend:latest
    build:
      dockerfile: Dockerfile
      context: .
      additional_contexts:
        dsp_config: ../rer-dsp-core/config
      args:
        - DSP_BACKEND_PROJECT_NAME=rer-dsp-backend
        - DSP_BACKEND_VERSION=0.0.1-SNAPSHOT
    container_name: dsp-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_SERVLET_CONTEXT_PATH: /dsp-backend
      DSP_CORS_ALLOWED_ORIGINS: http://localhost,http://localhost/dsp,http://localhost:5173,http://localhost:8081
    networks:
      - dsp_network

networks:
  dsp_network:
    name: dsp_network
